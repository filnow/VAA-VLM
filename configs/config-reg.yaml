defaults:
  - model: qwen_7b
  - dataset: naps

# --- Path Configurations ---
prompt_config_path: "prompts/prompt-reg.json"
emotion_definitions_path: "data/emotion_reg.json"

seed: 42  # Random seed for reproducibility

# --- Output CSV Configuration ---
output:
  filename: "results/${dataset.name}-reg-${model.name}.csv"

# --- Model Sampling Parameters ---
sampling_params:
  max_tokens: 1  
  temperature: 0.5
  n: 50
  seed: 42    

# --- Weights & Biases Logging ---
wandb:
  project: "${dataset.name}-reg" 
  job_type: "model-regression"
  run_name: "${dataset.name}-reg-${model.name}"

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

  
